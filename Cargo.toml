[package]
name = "rice-dunst-reels"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = "0.19"
tray-icon = "0.19"
open = "5.0"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
# Scripted test hooks (src/hooks.rs). Off by default; enable with `cargo run --features debug-hooks`.
debug-hooks = []
