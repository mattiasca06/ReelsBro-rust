<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent !important; width: 100vw; height: 100vh; overflow: hidden;
        font-family: 'JetBrains Mono', 'Segoe UI', sans-serif; user-select: none; }
    #grid { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
        width: 100vw; height: 100vh; gap: var(--gap, 12px); }
    .card { position: relative; flex: none; width: var(--cw); height: var(--ch); overflow: hidden; cursor: pointer;
        background: rgba(17, 17, 27, 0.96); border: 3px solid var(--accent, #cba6f7); border-radius: 18px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8); animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .card img, .card video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .card .fail { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: rgba(205, 214, 244, 0.6); font-size: 16px; }
    .who { position: absolute; left: 14px; bottom: 16px; padding: 4px 12px; border-radius: 999px; font-size: 14px;
        font-weight: 700; color: #cdd6f4; background: rgba(17, 17, 27, 0.75); pointer-events: none; }
    .more { position: absolute; right: 14px; top: 12px; padding: 4px 12px; border-radius: 999px; font-size: 14px;
        font-weight: 700; color: #11111b; background: var(--accent, #cba6f7); pointer-events: none; }
    /* Countdown: the bar drains from right to left over the time the pictures stay up. */
    .bar { position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: var(--accent, #cba6f7);
        transform-origin: left center; animation: drain var(--dur) linear forwards; pointer-events: none; }
    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes popIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="grid"></div>
<script>
    const grid = document.getElementById('grid');
    const cards = new Map(); // url -> card element
    let timer = null;

    function makeCard(it) {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.setProperty('--accent', it.accent);
        let el;
        if (it.kind === 'gifv') {
            el = document.createElement('video');
            el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true;
        } else {
            el = document.createElement('img');
        }
        el.draggable = false;
        el.addEventListener('error', () => {
            el.remove();
            const fail = document.createElement('div');
            fail.className = 'fail';
            fail.textContent = "Couldn't load picture";
            card.prepend(fail);
        });
        el.src = it.url;
        card.appendChild(el);
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = '@' + it.author;
        card.appendChild(who);
        // Click opens the picture in the browser (not for the settings preview).
        card.addEventListener('click', () => {
            if (/^https?:/.test(it.url)) window.ipc.postMessage('open_media:' + it.url);
        });
        return card;
    }

    // Draws all cards, restarts the shared countdown (durationMs 0 = no timer, used by the preview)
    // and asks to be hidden when it runs out. Cards already on screen are kept so gifs don't restart.
    function showMedia(items, cw, ch, gap, durationMs, extra) {
        grid.style.setProperty('--cw', cw + 'px');
        grid.style.setProperty('--ch', ch + 'px');
        grid.style.setProperty('--gap', gap + 'px');
        for (const it of items) {
            if (!cards.has(it.url)) {
                const card = makeCard(it);
                cards.set(it.url, card);
                grid.appendChild(card);
            }
        }
        cards.forEach((card) => {
            card.querySelectorAll('.bar, .more').forEach(n => n.remove());
            if (durationMs > 0) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.setProperty('--dur', durationMs + 'ms');
                card.appendChild(bar);
            }
        });
        if (extra > 0 && items.length) {
            const more = document.createElement('div');
            more.className = 'more';
            more.textContent = '+' + extra + ' more';
            cards.get(items[items.length - 1].url).appendChild(more);
        }
        clearTimeout(timer);
        if (durationMs > 0) timer = setTimeout(() => window.ipc.postMessage('media_done'), durationMs);
    }

    function clearMedia() {
        clearTimeout(timer);
        cards.clear();
        grid.innerHTML = '';
    }

    function previewMedia(cw, ch, gap) {
        clearMedia();
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
            + '<stop offset="0" stop-color="#cba6f7"/><stop offset="1" stop-color="#89b4fa"/></linearGradient></defs>'
            + '<rect width="1280" height="720" fill="url(#g)"/><text x="640" y="400" font-size="72" font-family="Segoe UI" fill="#11111b" text-anchor="middle">Image preview</text></svg>';
        showMedia([{ url: 'data:image/svg+xml;utf8,' + encodeURIComponent(svg), kind: 'image', author: 'Preview', accent: '#cba6f7' }], cw, ch, gap, 0, 0);
    }
</script>
</body>
</html>
